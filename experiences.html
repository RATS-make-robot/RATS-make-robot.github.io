<!-- experiences.html -->
<section id="experiences">
        <h2>Awards</h2>
        <p>수상 내역(2019~)은 아래에서 확인하실 수 있습니다.</p>

        <div class="awards-counter-container counter-animate-trigger">
                <div class="counter-item">
                        <div class="counter-number external-counter" data-target="0">0</div>
                        <div class="counter-label">External Awards</div>
                </div>
                <div class="counter-divider"></div>
                <div class="counter-item">
                        <div class="counter-number school-counter" data-target="0">0</div>
                        <div class="counter-label">School Awards</div>
                </div>
        </div>

        <div class="experience-container">
                <!-- 동적으로 로드됨 -->
        </div>
</section>

<!-- CSS for experiences -->
<style>
        /* 카운터 섹션 스타일 */
        .awards-counter-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 3rem;
                margin-bottom: 3rem;
                padding: 2rem;

                background: rgba(10, 14, 26, 0.4);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 16px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .counter-item {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-width: 150px;
        }

        .counter-number {
                font-size: 3.5rem;
                font-weight: 800;
                color: #fff;
                margin-bottom: 0.5rem;
                font-family: 'JetBrains Mono', monospace;

                background: linear-gradient(135deg, #fff 0%, #00d4ff 100%);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;

                text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .counter-label {
                font-size: 1rem;
                color: #94a3b8;
                font-weight: 500;
                letter-spacing: 0.05em;
                text-transform: uppercase;
        }

        .counter-divider {
                width: 1px;
                height: 60px;
                background: linear-gradient(to bottom, transparent, rgba(0, 212, 255, 0.3), transparent);
        }

        /* 경험 카드 컨테이너 - 그리드 레이아웃 */
        .experience-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                gap: 1.5rem;
                margin-top: 2rem;
        }

        /* 경험 카드 */
        .experience-card {
                background: rgba(31, 41, 55, 0.7);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(0, 212, 255, 0.25);
                border-radius: 12px;
                padding: 1.5rem;

                position: relative;
                overflow: hidden;

                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 그라데이션 배경 효과 */
        .experience-card::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: conic-gradient(transparent,
                                rgba(0, 212, 255, 0.1),
                                transparent 30%);
                opacity: 0;
                transition: opacity 0.4s ease;
        }

        .experience-card:hover::before {
                opacity: 1;
                animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
                100% {
                        transform: rotate(360deg);
                }
        }

        /* Hover 효과 */
        .experience-card:hover {
                transform: translateY(-8px) scale(1.02);
                border-color: rgba(0, 212, 255, 0.5);
                box-shadow:
                        0 15px 40px rgba(0, 0, 0, 0.5),
                        0 0 60px rgba(0, 212, 255, 0.3);
        }

        /* 연도 제목 */
        .experience-card h3 {
                font-size: 1.75rem;
                font-weight: 800;
                margin-bottom: 1rem;
                padding-bottom: 0.75rem;
                color: #00d4ff;
                text-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
                letter-spacing: -0.02em;
                position: relative;
                z-index: 1;

                display: flex;
                align-items: center;
                gap: 0.5rem;

                border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .experience-card h3::before {
                content: '🏆';
                font-size: 1.5rem;
                animation: trophy-float 2s ease-in-out infinite;
        }

        @keyframes trophy-float {

                0%,
                100% {
                        transform: translateY(0);
                }

                50% {
                        transform: translateY(-4px);
                }
        }

        /* 대회명 및 수상 리스트 */
        .competition-row {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 0.75rem;
                margin: 0.6rem 0;
                padding: 0.5rem;
                border-radius: 6px;
                background: rgba(0, 0, 0, 0.15);
                border-left: 2px solid transparent;
                transition: all 0.3s ease;
                position: relative;
                z-index: 1;
        }

        .competition-row:hover {
                background: rgba(0, 212, 255, 0.1);
                border-left-color: #00d4ff;
                transform: translateX(6px);
                box-shadow: 0 2px 12px rgba(0, 212, 255, 0.2);
        }

        .competition-title {
                font-weight: 600;
                color: #e2e8f0;
                flex: 1;
                line-height: 1.5;
                font-size: 0.9rem;
        }

        .award-list {
                display: flex;
                flex-direction: column;
                gap: 0.3rem;
                align-items: flex-end;
        }

        .award-list code {
                background: linear-gradient(135deg,
                                rgba(0, 212, 255, 0.2),
                                rgba(34, 211, 238, 0.15));
                border: 1px solid rgba(0, 212, 255, 0.35);
                color: #22d3ee;

                font-size: 0.75rem;
                font-weight: 700;
                padding: 0.3rem 0.7rem;
                border-radius: 12px;

                font-family: 'Inter', sans-serif;
                white-space: nowrap;

                box-shadow: 0 2px 8px rgba(0, 212, 255, 0.2);
                transition: all 0.3s ease;
                display: inline-block;
        }

        .award-list code:hover {
                background: linear-gradient(135deg,
                                rgba(0, 212, 255, 0.3),
                                rgba(34, 211, 238, 0.25));
                border-color: rgba(0, 212, 255, 0.6);
                box-shadow:
                        0 4px 15px rgba(0, 212, 255, 0.4),
                        0 0 20px rgba(0, 212, 255, 0.3);
                transform: translateY(-2px) scale(1.05);
        }

        /* 반응형 - 태블릿 */
        @media (max-width: 1024px) {
                .experience-container {
                        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                }
        }

        /* 반응형 - 모바일 */
        @media (max-width: 768px) {
                .awards-counter-container {
                        flex-direction: column;
                        gap: 1.5rem;
                        padding: 1.5rem;
                }

                .counter-divider {
                        width: 80%;
                        height: 1px;
                        background: linear-gradient(to right, transparent, rgba(0, 212, 255, 0.3), transparent);
                }

                .experience-container {
                        grid-template-columns: 1fr;
                }

                .experience-card h3 {
                        font-size: 1.5rem;
                }

                .competition-row {
                        flex-direction: column;
                        gap: 0.5rem;
                }

                .award-list {
                        flex-direction: row;
                        flex-wrap: wrap;
                        align-items: flex-start;
                }
        }

        /* 등장 애니메이션 */
        @keyframes fadeInUp {
                from {
                        opacity: 0;
                        transform: translateY(20px);
                }

                to {
                        opacity: 1;
                        transform: translateY(0);
                }
        }

        .experience-card {
                animation: fadeInUp 0.6s ease-out backwards;
        }

        .experience-card:nth-child(1) {
                animation-delay: 0.05s;
        }

        .experience-card:nth-child(2) {
                animation-delay: 0.1s;
        }

        .experience-card:nth-child(3) {
                animation-delay: 0.15s;
        }

        .experience-card:nth-child(4) {
                animation-delay: 0.2s;
        }

        .experience-card:nth-child(5) {
                animation-delay: 0.25s;
        }

        .experience-card:nth-child(6) {
                animation-delay: 0.3s;
        }
</style>
