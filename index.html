<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="명지대학교 로봇·임베디드 중앙동아리 RATS since 1993">
    <meta property="og:title" content="RATS 홍보페이지">
    <meta property="og:type" content="website">
    <meta property="og:description" content="명지대학교 로봇·임베디드 중앙동아리 RATS since 1993">
    <meta property="og:image" content="/assets/images/site/RATS-preview.png">
    <meta property="og:url" content="https://join.mju-rats.com/">
    <title>RATS 홍보페이지 - 명지대학교 로봇·임베디드 중앙동아리</title>
    <link rel="RATS icon" type="image/x-icon" href="/assets/images/site/RATS.ico">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/layout-desktop.css">
</head>

<body>
    <!-- 3D 배경 컨테이너 -->
    <div id="canvas-container"></div>



    <!-- 사이드바 네비게이션 (PC) -->
    <div id="sidebar-container"></div>

    <!-- 모바일 햄버거 메뉴 -->
    <div id="mobile-menu-container"></div>

    <!-- 메인 컨텐츠 영역 -->
    <main class="main-content">

        <!-- STL 업로더 (내용 영역 최상단 우측) -->
        <div class="uploader">
            <div class="uploader-hint">
                <span>배경 3D 모델 변경 가능</span>
            </div>
            <label class="file-btn" title=".stl 파일을 선택하여 3D 모델 교체">
                <span>Load STL</span>
                <input id="modelFile" type="file" accept=".stl,model/stl" />
            </label>
        </div>

        <!-- Hero 섹션 (3D 모델 감상용 빈 공간) -->
        <section id="hero" class="hero-spacer">
            <div class="hero-content">
                <img src="assets/images/logos/RATS-white.svg" alt="RATS Logo" class="hero-logo">
                <p>Robotic Automatic Technology Society</p>
                <div class="scroll-down">
                    <span>Scroll Down<br>26년 신입생 모집중!</26></span>
                    <i class="arrow-down">↓</i>
                </div>
            </div>
        </section>

        <!-- About 섹션 -->
        <div id="about-container"></div>

        <!-- Skills 섹션 -->
        <div id="skills-container"></div>

        <!-- Experiences 섹션 -->
        <div id="experiences-container"></div>

        <!-- Projects 섹션 -->
        <div id="projects-container"></div>

        <!-- Seminars 섹션 -->
        <div id="seminars-container"></div>

        <!-- Join 섹션 -->
        <div id="join-container"></div>

        <!-- Contact 섹션 -->
        <div id="contact-container"></div>

        <!-- Footer -->
        <div id="footer-container"></div>
        </div>

        <!-- 맨 위로 버튼 -->
        <button id="scroll-to-top" class="scroll-to-top" aria-label="맨 위로">
            <span>↑</span>
        </button>

        <!-- YAML 파서 -->
        <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

        <!-- 메인 스크립트 -->
        <script>
            // 다크모드 초기화
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark-mode');
            }

            // 구글 폼 링크 함수
            function goToGoogleForm() {
                const googleFormLink = "https://docs.google.com/forms/d/e/1FAIpQLSd4Rkak0xaQN-viuDshFsGwdiD3EXXiwNRuNq7dSu4258CtLw/viewform";
                window.open(googleFormLink, "_blank");
            }<!--//forms.gle/XKPrFaa9jzYfDeA28-->

            // 컴포넌트 로드 함수 (재시도 로직 포함)
            async function loadComponent(file, containerId, retries = 3) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const html = await response.text();
                    document.getElementById(containerId).innerHTML = html;
                } catch (error) {
                    console.error(`Error loading ${file}:`, error);
                    if (retries > 0) {
                        console.log(`Retrying ${file}... (${retries} attempts left)`);
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        return loadComponent(file, containerId, retries - 1);
                    } else {
                        document.getElementById(containerId).innerHTML = `<div class="error-msg">Failed to load content. Please refresh the page.</div>`;
                    }
                }
            }

            // 모든 컴포넌트 로드 및 초기화
            document.addEventListener('DOMContentLoaded', async () => {
                // 1. 모든 HTML 컴포넌트 병렬 로드
                await Promise.all([
                    loadComponent('sidebar-nav.html', 'sidebar-container'),
                    loadComponent('mobile-menu.html', 'mobile-menu-container'),
                    loadComponent('about.html', 'about-container'),
                    loadComponent('skills.html', 'skills-container'),
                    loadComponent('experiences.html', 'experiences-container'),
                    loadComponent('projects.html', 'projects-container'),
                    loadComponent('seminars.html', 'seminars-container'),
                    loadComponent('join.html', 'join-container'),
                    loadComponent('contact.html', 'contact-container'),
                    loadComponent('footer.html', 'footer-container')
                ]);

                // 2. HTML 로드 완료 후 기능 초기화

                // About 섹션 타이핑 애니메이션
                const typingElement = document.getElementById("code-display");
                if (typingElement) {
                    initializeTypingAnimation(typingElement);
                }

                // 데이터 로딩 (YAML -> HTML)
                if (window.loadProjects) window.loadProjects();
                if (window.loadExperiences) window.loadExperiences();
                if (window.loadSeminars) window.loadSeminars();

                // 섹션 감지 및 네비게이션 하이라이트
                setupSectionObserver();

                // 스크롤 투 탑 버튼
                setupScrollToTop();

                // 스크롤 애니메이션 초기화 (콘텐츠 로드 후)
                if (window.setupSectionAnimations) {
                    window.setupSectionAnimations();
                } else {
                    setTimeout(() => {
                        if (window.setupSectionAnimations) window.setupSectionAnimations();
                    }, 500);
                }


                // [NEW] 모바일 네비게이션 로직
                setupMobileNav();

                // [NEW] PC 사이드바 로직 (로드 후)
                setupSidebarNav();

                // [NEW] 배경 3D 모델 및 Join 섹션 3D 배경 초기화 (레이아웃 안정화 후)
                if (window.initBackground3D) window.initBackground3D();
                if (window.initJoin3D) window.initJoin3D();
            });

            // [NEW] 모바일 네비게이션 설정 (링크 클릭 시 CSS scroll-margin-top 활용)
            function setupMobileNav() {
                const mobileLinks = document.querySelectorAll('.mobile-top-nav .nav-link');
                mobileLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        // href를 통해 네이티브 smooth scroll과 scroll-margin-top이 작동함
                    });
                });
            }

            // PC 사이드바 네비게이션 설정
            function setupSidebarNav() {
                const sidebarLinks = document.querySelectorAll('.sidebar-menu .nav-item');
                const progressFill = document.getElementById('sidebar-scroll-progress');
                const sections = document.querySelectorAll('section');

                // 1. 링크 클릭
                sidebarLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        // 모든 링크 active 제거
                        sidebarLinks.forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                        // href 이동은 브라우저 기본 동작(smooth scroll)과 CSS scroll-margin-top에 맡김
                    });
                });
            }

            // 전역 스크롤 핸들러 (모바일 & PC 공용)
            window.addEventListener('scroll', () => {
                const progressBar = document.getElementById('mobile-progress-bar');
                const sidebarProgress = document.getElementById('sidebar-scroll-progress');
                const sections = document.querySelectorAll('section');
                const navLinks = document.querySelectorAll('.mobile-top-nav .nav-link, .sidebar-menu .nav-item');

                // 공통 변수
                const scrollY = window.pageYOffset;
                const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrollPercent = (scrollY / docHeight) * 100;

                // 1. 프로그레스 바 업데이트
                if (progressBar) progressBar.style.width = scrollPercent + "%"; // 모바일
                if (sidebarProgress) sidebarProgress.style.width = scrollPercent + "%"; // PC

                // 추가: 클래스로 지정된 모든 프로그레스 바 업데이트 (e.g. nav.html)
                document.querySelectorAll('.scroll-progress-bar').forEach(bar => {
                    bar.style.width = scrollPercent + "%";
                });

                // 2. 섹션 감지 및 활성 링크 업데이트
                let current = '';
                // [MODIFY] 헤더 높이 및 감지 오차 조정 (70px 기준)
                const headerHeight = window.innerWidth <= 1024 ? 70 : 20;

                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    if (scrollY >= sectionTop - headerHeight - 100) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href').substring(1) === current) {
                        link.classList.add('active');

                        // 모바일 네비게이션 자동 스크롤
                        if (link.closest('.mobile-top-nav')) {
                            link.scrollIntoView({
                                behavior: 'smooth',
                                inline: 'center',
                                block: 'nearest'
                            });
                        }
                    }
                });
            });

            // 타이핑 애니메이션 초기화
            function initializeTypingAnimation(typingElement) {
                const sentences = [
                    "로봇을 개발합니다.",
                    "앱도 개발합니다.",
                    "임베디드 설계도 합니다.",
                    "게임도 합니다.",
                    "세미나도 합니다."
                ];

                const languages = [
                    {
                        name: "C",
                        commentSym: "//",
                        template: (s) => ({
                            plain: `printf("${s}\\n");`,
                            highlighted: `<span class='keyword'>printf</span>(<span class='string'>"${s}\\n"</span>);`
                        })
                    },
                    {
                        name: "Python",
                        commentSym: "#",
                        template: (s) => ({
                            plain: `print("${s}")`,
                            highlighted: `<span class='keyword'>print</span>(<span class='string'>"${s}"</span>)`
                        })
                    },
                    {
                        name: "Java",
                        commentSym: "//",
                        template: (s) => ({
                            plain: `System.out.println("${s}");`,
                            highlighted: `<span class='keyword'>System.out.println</span>(<span class='string'>"${s}"</span>);`
                        })
                    },
                    {
                        name: "HTML",
                        commentSym: "&lt;!--",
                        commentEnd: "--&gt;",
                        template: (s) => {
                            const tag = ["h1", "h2", "h3", "h4", "div", "p"][Math.floor(Math.random() * 6)];
                            return {
                                plain: `<${tag}>${s}</${tag}>`,
                                highlighted: `<span class='tag'>&lt;${tag}&gt;</span>${s}<span class='tag'>&lt;/${tag}&gt;</span>`
                            };
                        }
                    },
                    {
                        name: "Go",
                        commentSym: "//",
                        template: (s) => ({
                            plain: `fmt.Println("${s}")`,
                            highlighted: `<span class='keyword'>fmt.Println</span>(<span class='string'>"${s}"</span>)`
                        })
                    }
                ];

                let sentenceIdx = 0;
                let langIdx = 0;
                let charIdx = 0;
                let isDeleting = false;
                let currentTextObj = null;
                let typeSpeed = 100;

                function type() {
                    // 현재 문장 및 언어 설정
                    const sentence = sentences[sentenceIdx];
                    const lang = languages[langIdx];

                    // 텍스트 객체 생성 (한 번만)
                    if (!currentTextObj) {
                        currentTextObj = lang.template(sentence);
                    }

                    const fullText = currentTextObj.plain;
                    const commentPart = lang.name === "HTML"
                        ? `<span class="language-comment">${lang.commentSym} ${lang.name} ${lang.commentEnd}</span>`
                        : `<span class="language-comment">${lang.commentSym} ${lang.name}</span>`;

                    // 타이핑/삭제 로직
                    let displayText = "";
                    if (isDeleting) {
                        charIdx--;
                        displayText = fullText.substring(0, charIdx);
                    } else {
                        charIdx++;
                        displayText = fullText.substring(0, charIdx);
                    }

                    // 화면 출력 (주석은 고정, 코드는 타이핑)
                    // 내용이 HTML 태그일 경우(HTML 언어), plain 텍스트로 보여주기 위해 escape 필요할 수도 있으나
                    // 여기서는 innerHTML로 넣으므로 plain 텍스트가 태그로 해석될 수 있음.
                    // HTML 언어의 경우 plain이 `<Tag>...` 형태이므로 innerHTML에 넣으면 태그로 보임.
                    // 하지만 우리는 '소스코드'를 보여주는 것이므로 태그 자체가 텍스트로 나와야 함.
                    // 따라서 plain 텍스트를 escape 처리해서 넣어야 함.

                    let escapedText = displayText
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;");

                    typingElement.innerHTML = `${commentPart}<br>${escapedText}<span class="cursor"></span>`;

                    // 속도 조절
                    typeSpeed = isDeleting ? 40 : 100;

                    // 상황별 상태 변경
                    if (!isDeleting && charIdx === fullText.length) {
                        // 타이핑 완료 -> 구문 강조 적용 및 대기
                        typingElement.innerHTML = `${commentPart}<br>${currentTextObj.highlighted}<span class="cursor"></span>`;
                        typeSpeed = 2000; // 2초 대기
                        isDeleting = true;
                    } else if (isDeleting && charIdx === 0) {
                        // 삭제 완료 -> 다음 문장/언어로 변경
                        isDeleting = false;
                        currentTextObj = null;
                        sentenceIdx = (sentenceIdx + 1) % sentences.length;
                        langIdx = (langIdx + 1) % languages.length; // 언어도 같이 순환
                        typeSpeed = 500;
                    }

                    setTimeout(type, typeSpeed);
                }

                type();
            }

            // 섹션 감지 및 네비게이션 하이라이트
            function setupSectionObserver() {
                const sections = document.querySelectorAll('section[id]');
                const navItems = document.querySelectorAll('.nav-item');

                const observerOptions = {
                    root: null,
                    rootMargin: '-50% 0px -50% 0px',
                    threshold: 0
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const sectionId = entry.target.getAttribute('id');
                            navItems.forEach(item => {
                                item.classList.remove('active');
                                if (item.getAttribute('data-section') === sectionId) {
                                    item.classList.add('active');
                                }
                            });
                        }
                    });
                }, observerOptions);

                sections.forEach(section => observer.observe(section));
            }

            // 스크롤 투 탑 버튼
            function setupScrollToTop() {
                const scrollToTopBtn = document.getElementById('scroll-to-top');

                window.addEventListener('scroll', () => {
                    if (window.scrollY > 300) {
                        scrollToTopBtn.classList.add('visible');
                    } else {
                        scrollToTopBtn.classList.remove('visible');
                    }
                });

                scrollToTopBtn.addEventListener('click', () => {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });
            }
        </script>

        <!-- 데이터 로딩 스크립트 -->
        <script src="assets/js/load_projects.js"></script>
        <script src="assets/js/load_experiences.js"></script>
        <script src="assets/js/load_seminars.js"></script>

        <!-- 스크롤 애니메이션 -->
        <script src="assets/js/scroll-animations.js"></script>
        <!-- Three.js & STLLoader -->
        <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
        <script type="module" src="assets/js/bg-3d-model.js"></script>
        <script type="module" src="assets/js/join-3d.js"></script>
</body>
