<!-- seminar.html -->
<section id="seminars">
    <h2>Seminars</h2>
    <p>동아리 활동 중 진행된 세미나를 확인하세요.</p>
    <div class="seminar-container">
        <!-- Seminars will be dynamically added here -->
    </div>
</section>

<!-- CSS -->
<style>
    .seminar-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2rem;
        margin-top: 2rem;
    }

    .seminar-card {
        background: rgba(31, 41, 55, 0.5);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 212, 255, 0.15);
        border-radius: 12px;
        padding: 1.5rem;

        position: relative;
        overflow: hidden;

        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .seminar-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
        transition: left 0.6s ease;
    }

    .seminar-card:hover::before {
        left: 100%;
    }

    .seminar-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: rgba(0, 212, 255, 0.4);
        box-shadow:
            0 12px 30px rgba(0, 0, 0, 0.4),
            0 0 40px rgba(0, 212, 255, 0.2);
    }

    .seminar-card h3 {
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #00d4ff;
        letter-spacing: -0.01em;
    }

    .seminar-card p {
        font-size: 0.95rem;
        color: #cbd5e1;
        margin: 0.5rem 0;
        line-height: 1.6;
    }

    .seminar-card a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        text-decoration: none;
        color: #22d3ee;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .seminar-card a:hover {
        color: #00d4ff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        transform: translateX(5px);
    }

    .seminar-card a img {
        width: 24px;
        height: auto;
        filter: drop-shadow(0 2px 4px rgba(0, 212, 255, 0.3));
    }

    .seminar-card-image {
        width: 100%;
        max-width: 100%;
        height: 200px;
        border-radius: 8px;
        margin-bottom: 1rem;
        object-fit: cover;

        border: 1px solid rgba(0, 212, 255, 0.2);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

        transition: all 0.4s ease;
    }

    .seminar-card:hover .seminar-card-image {
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        border-color: rgba(0, 212, 255, 0.4);
    }

    .seminar-card img[src="undefined"],
    .seminar-card img:not([src]) {
        display: none;
    }

    @media (max-width: 768px) {
        .seminar-container {
            grid-template-columns: 1fr;
        }
    }
</style>
