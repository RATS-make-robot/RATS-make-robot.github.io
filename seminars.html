<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="명지대학교 로봇·임베디드 중앙동아리 RATS 세미나">
    <title>Seminars - RATS</title>
    <!-- 파비콘 적용 -->
    <link rel="icon" href="assets/images/site/RATS.ico" type="image/x-icon">
    <!-- 폰트 적용 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css?v=4">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .detail-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            background: linear-gradient(180deg, rgba(10, 14, 26, 0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
        }
        
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .btn-back:hover {
            color: #00d4ff;
        }
        
        .detail-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .detail-main {
            padding-top: 100px;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }
        
        /* 상세 페이지 그리드 */
        .seminar-section .seminar-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
            overflow: visible;
        }
        
        @media (max-width: 768px) {
            .seminar-section .seminar-container {
                grid-template-columns: 1fr;
            }
            .detail-title {
                display: none; 
            }
        }
    </style>
</head>
<body>
    <!-- 네온 오라 배경 -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div id="canvas-container"></div>

    <!-- 상단 헤더 -->
    <header class="detail-header">
        <a href="index.html" class="btn-back"><i class="ph-bold ph-arrow-left"></i> 홈으로 돌아가기</a>
        <h1 class="detail-title">RATS SEMINARS</h1>
    </header>

    <main class="detail-main">
        <section class="seminar-section">
            <div class="container">
                <p style="text-align: center; color: rgba(255,255,255,0.6); margin-bottom: 3rem;">선배들의 노하우가 담긴 세미나 아카이브입니다.</p>
                <div class="seminar-container">
                    <!-- load_seminars.js loads here as grid -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    
    <script src="assets/js/bg-3d-model.js"></script>
    <script>
        window.isSeminarDetailPage = true;
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.initBackground3D === 'function') {
                window.initBackground3D();
            }
            // 푸터 로드
            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                })
                .catch(err => console.error('Error loading footer:', err));
        });
    </script>
    <script src="assets/js/load_seminars.js"></script>
    <script src="assets/js/cursor-3d.js"></script>
</body>
</html>
