<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <filter id="neon-glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#neon-glow-p)">
    <!-- Base Arrow: Active State -->
    <path d="M6,6 L6,24 L10.5,19.5 L14.5,27 L18,25 L14,17.5 L21,17.5 Z" 
          fill="#a855f7" 
          stroke="#00d4ff" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
          
    <!-- Circuit Trace Active -->
    <path d="M9,11 L9,17 L13,24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- LED Sensor Active -->
    <circle cx="9" cy="11" r="2" fill="#ffffff" />
  </g>
</svg>
