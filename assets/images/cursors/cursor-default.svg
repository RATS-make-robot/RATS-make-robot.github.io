<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#neon-glow)">
    <!-- Base Arrow: Thick, Rounded, Mouse Cursor Shape -->
    <path d="M6,6 L6,24 L10.5,19.5 L14.5,27 L18,25 L14,17.5 L21,17.5 Z" 
          fill="#111827" 
          stroke="#00d4ff" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
          
    <!-- Circuit Trace (Robot/Embedded Theme) -->
    <path d="M9,11 L9,17 L13,24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- LED Sensor -->
    <circle cx="9" cy="11" r="1.5" fill="#00ff88" />
  </g>
</svg>
