# ==============================================================================
# 스폰서 데이터 파일 (sponsors.yaml)
# 이 파일은 웹사이트에서 스폰서/후원사 데이터를 동적으로 로드하는 데 사용됩니다.
#
# 최상위는 "등급(tier)" 그룹의 목록이며, 각 그룹은 items 배열을 가집니다.
# ------------------------------------------------------------------------------
# sponsors:
#   - tier: "등급/구분명"          # 그룹 제목 (선택, 생략하면 제목 없이 로고만 표시)
#     note: "부가 설명"            # 그룹 부제 (선택)
#     items:
#       - name: "회사명"           # 회사/기관 이름 (필수)
#         logo: "로고 경로"        # 로고 파일 경로 (필수) - .svg 권장, 없으면 .png/.jpg
#         link: "https://..."      # 회사 홈페이지 (선택, 있으면 로고가 클릭 가능해짐)
#         description: "한 줄 설명" # 로고 아래 표시될 설명 (선택)
#         invert: true             # 어두운 색 로고를 흰색으로 반전 (선택, 기본 false)
# ------------------------------------------------------------------------------
# 로고 이미지 가이드:
# 1. 로고 파일은 assets/images/sections/sponsors/ 폴더에 넣어주세요.
# 2. .svg 를 우선 사용하세요. 확대/축소해도 깨지지 않습니다.
#    .svg 가 없는 경우에만 .png (배경 투명 권장) 또는 .jpg 를 사용하세요.
# 3. 사이트가 다크 테마이므로, 검정/짙은 남색 계열 로고는 invert: true 를 주면
#    흰색으로 반전되어 잘 보입니다. (흰색/밝은 색 로고는 생략)
# 4. 가로로 긴 로고를 기준으로 배치됩니다. 정사각형 로고도 자동으로 맞춰집니다.
# 5. 로고 파일을 찾지 못하면 회사명 텍스트가 대신 표시되므로 레이아웃이 깨지지 않습니다.
# ------------------------------------------------------------------------------
# 최소 예시:
# ------------------------------------------------------------------------------
# sponsors:
#   - tier: "공식 후원사"
#     items:
#       - name: "회사명"
#         logo: "assets/images/sections/sponsors/example.svg"
# ------------------------------------------------------------------------------
# 주의사항:
# 1. YAML 파일은 들여쓰기와 공백에 민감합니다. 각 항목은 2칸 들여쓰기를 유지하세요.
# 2. 필수 항목 (`name`, `logo`)은 반드시 포함되어야 합니다.
# 3. tier 그룹 전체를 잠시 숨기려면 해당 블록 앞에 # 을 붙여 주석 처리하세요.
# 4. 스폰서가 한 곳도 없으면 섹션 자체가 자동으로 숨겨집니다.
# ==============================================================================

sponsors:
  - tier: "공식 후원사"
    note: "RATS의 활동을 지원해주시는 기업입니다."
    items:
      # 로고 원본: https://www.dfrobot.com/dfrobotshop/images/pc/logo.png (182x42, 투명 배경)
      # 밝은 색 로고라 invert 불필요
      - name: "DFRobot"
        logo: "assets/images/sections/sponsors/dfrobot.png"
        link: "https://www.dfrobot.com"
